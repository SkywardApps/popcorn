name: Release

# Triggered by pushing a tag of the form `release/vX.Y.Z` (or `release/vX.Y.Z-suffix`),
# normally created on a commit already on master. The tag is the single source of truth
# for the package version: both v8 packages are packed with that version (overriding the
# csproj <Version> via -p:Version=), pushed to NuGet, and attached to a GitHub Release.
# Tags with a suffix (e.g. 8.1.0-preview.1) produce a GitHub prerelease.
#
# The workflow does not edit the csproj <Version>: master only accepts changes through
# pull requests. Bump <Version> in both csproj files by PR before tagging (see the
# release checklist in docs/Releases.md).
#
# Two jobs:
# - `pack` builds the .nupkg/.snupkg files and uploads them as the `nuget-packages`
#   artifact. It does not reference the NuGet API key.
# - `publish` runs under the `nuget-release` environment, so a required reviewer must
#   approve each run before it starts. It is the only job that uses SKYWARDNUGETAPIKEY.
#   The reviewer can inspect the `pack` log and the artifact first.
#
# Note: SKYWARDNUGETAPIKEY is an organization secret, so any job in this repository can
# read it. The environment approval gates the job that uses it, not access to the
# secret. Moving it to an environment secret on `nuget-release` would restrict it to
# approved runs of that environment.

on:
  push:
    tags:
      - 'release/v*'

permissions:
  contents: read

jobs:
  pack:
    name: Pack NuGet packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # SourceLink needs full history to resolve commit hashes

      - name: Extract version from tag
        id: ver
        run: |
          # Tag: refs/tags/release/v8.0.0           → version 8.0.0
          # Tag: refs/tags/release/v8.1.0-preview.1 → version 8.1.0-preview.1
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#release/v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not in the expected format release/vX.Y.Z[-suffix]"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Setup .NET SDK (from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # -p:Version= and -p:PackageVersion= together make the emitted .nupkg carry the
      # tag's version regardless of what <Version> the csproj has.
      - name: Pack Popcorn.Shared
        working-directory: dotnet
        run: >
          dotnet pack Popcorn.Shared/Popcorn.Shared.csproj
          -c Release
          -p:Version=${{ steps.ver.outputs.version }}
          -p:PackageVersion=${{ steps.ver.outputs.version }}
          --output ../publish

      - name: Pack Popcorn.SourceGenerator
        working-directory: dotnet
        run: >
          dotnet pack Popcorn.SourceGenerator/Popcorn.SourceGenerator.csproj
          -c Release
          -p:Version=${{ steps.ver.outputs.version }}
          -p:PackageVersion=${{ steps.ver.outputs.version }}
          --output ../publish

      - name: List packaged artifacts
        run: ls -la publish/

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            publish/*.nupkg
            publish/*.snupkg
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to NuGet, create GitHub release
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Required reviewers on this environment gate every publish. Configure it under
    # Settings → Environments → nuget-release.
    environment:
      name: nuget-release
      url: https://www.nuget.org/packages/Skyward.Api.Popcorn.SourceGen
    permissions:
      contents: write  # needed only for `gh release create`
    env:
      VERSION: ${{ needs.pack.outputs.version }}

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # nothing in this job pushes to git

      - name: Setup .NET SDK (from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: publish

      - name: List packages to publish
        run: ls -la publish/

      # `dotnet nuget push *.nupkg` automatically pushes the sibling .snupkg symbol
      # package if one exists, so a single loop over *.nupkg is enough.
      # `--skip-duplicate` replaces the old `|| :` hack: if someone re-runs a release
      # (same tag, re-push), we don't fail on "already exists."
      - name: Push packages to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.SKYWARDNUGETAPIKEY }}
        working-directory: publish
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::Secret SKYWARDNUGETAPIKEY is not set — cannot push to NuGet."
            exit 1
          fi
          for pkg in *.nupkg; do
            echo "Pushing $pkg"
            dotnet nuget push "$pkg" \
              -k "$NUGET_API_KEY" \
              -s https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      # A version with a suffix (8.1.0-preview.1, 9.0.0-rc.1) is a prerelease: mark it
      # so it never shows as the repository's Latest release.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          PRERELEASE=()
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "v${VERSION}" \
            --generate-notes \
            "${PRERELEASE[@]}" \
            publish/*.nupkg publish/*.snupkg
